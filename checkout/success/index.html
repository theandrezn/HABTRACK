<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | HabTrack</title>
  <link rel="icon" type="image/png" href="../../images/habtrack-icon.png">
  <link rel="stylesheet" href="../checkout.css">
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '27284228041269455');
    fbq('track', 'PageView');
  </script>
</head>
<body>
  <header class="checkout-header">
    <div class="checkout-header__inner">
      <a href="../../"><img class="checkout-logo" src="../../images/habtrack-logo-header.png" alt="HabTrack"></a>
      <span class="secure-label">THANK YOU</span>
    </div>
  </header>
  <main class="status-card">
    <h1 id="status-title">Confirming your HabTrack order...</h1>
    <p id="status-copy">Please wait while we confirm your payment and prepare your access details.</p>
    <a href="../../">Return to HabTrack</a>
  </main>
  <script>
    (async function () {
      const title = document.querySelector("#status-title");
      const copy = document.querySelector("#status-copy");
      const sessionId = new URLSearchParams(window.location.search).get("session_id");
      if (!sessionId) {
        title.textContent = "Order not found";
        copy.textContent = "We could not identify your checkout session. Please contact support if you completed a payment.";
        return;
      }

      try {
        const response = await fetch("/api/checkout-session?session_id=" + encodeURIComponent(sessionId), { cache: "no-store" });
        const session = await response.json();
        if (!response.ok) throw new Error(session.error || "Unable to confirm order.");

        if (session.payment_status === "paid") {
          title.textContent = "Thank you for your order";
          copy.textContent = "Your payment was confirmed. HabTrack access details will be delivered to " + (session.customer_email || "your email") + ".";
          if (window.fbq && !sessionStorage.getItem("habtrack_purchase_" + sessionId)) {
            sessionStorage.setItem("habtrack_purchase_" + sessionId, "1");
            fbq("track", "Purchase", {
              value: Number(session.amount_total || 0) / 100,
              currency: session.currency || "USD",
              content_name: "HabTrack - Habit + Task Tracker",
              content_ids: ["habtrack-habit-task-system"],
              num_items: Number(session.item_count || 1)
            }, { eventID: sessionId });
          }
        } else {
          title.textContent = "Payment processing";
          copy.textContent = "Your payment is still being processed. You will receive your HabTrack access details as soon as it is confirmed.";
        }
      } catch (error) {
        title.textContent = "We are checking your order";
        copy.textContent = "Your checkout was received, but we could not confirm the status yet. Please keep your payment confirmation email.";
      }
    })();
  </script>
</body>
</html>
